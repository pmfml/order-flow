server:
  port: ${SERVER_PORT:8090}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes: []

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  security:
    oauth2:
      resourceserver:
        jwt:
          # Points to the mock-oauth2-server (docker-compose) in development.
          # For production, override via environment variables to the real provider.
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8099/orderflow}
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:8099/orderflow/jwks}

app:
  rate-limit:
    replenish-rate: ${RATE_LIMIT_REPLENISH:10}
    burst-capacity: ${RATE_LIMIT_BURST:20}

# --- Observability ---
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  tracing:
    sampling:
      probability: 1.0
  metrics:
    tags:
      application: ${spring.application.name}

# --- Logging ---
logging:
  level:
    root: INFO
    com.pmfml.orderflow: DEBUG
