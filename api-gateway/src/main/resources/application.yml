server:
  port: ${SERVER_PORT:8090}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes: []

  security:
    oauth2:
      resourceserver:
        jwt:
          # In development, we rely on a minimal local issuer (Step 7.3) or bypass via mocks in tests.
          # For production, this will point to GateKeeper's real issuer URI.
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8090}

# --- Logging ---
logging:
  level:
    root: INFO
    com.pmfml.orderflow: DEBUG
