spring.application.name=order-service
server.port=${SERVER_PORT:8091}

# --- Datasource ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5436/orders}
spring.datasource.username=${DB_USERNAME:orderflow_user}
spring.datasource.password=${DB_PASSWORD:orderflow_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA ---
# Flyway owns the schema; Hibernate only validates that entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- gRPC Client ---
grpc.client.inventory-service.address=static://localhost:9095
grpc.client.inventory-service.negotiationType=plaintext

# --- Kafka ---
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.group-id=order-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# --- Outbox Poller ---
# The destination topic is the event's own eventType (see EventTypes), so there
# is no single configured topic to set here.
orderflow.outbox.poll-interval-ms=500
# How long to wait for the broker to acknowledge a record before giving up and
# leaving the event pending for the next cycle.
orderflow.outbox.send-timeout-ms=10000

# --- Logging ---
logging.level.root=INFO
logging.level.com.pmfml.orderflow=DEBUG
