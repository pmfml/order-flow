# Test-scoped configuration. Hibernate generates the schema from the entities so
# that slices stay fast and independent of the migration history.
#
# The trade-off is that these settings hide entity/migration drift: a column
# renamed in an entity but not in a migration still passes here, because the
# schema is regenerated from that very entity. FlywayMigrationTest overrides both
# properties to run the real migrations with ddl-auto=validate, and is the only
# place the production schema is exercised.
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

# --- Outbox Poller ---
# This file shadows src/main/resources/application.properties rather than merging
# with it: both resolve to classpath:/application.properties and the test copy
# wins. Any property the beans require must therefore be repeated here.
orderflow.outbox.poll-interval-ms=999999999
orderflow.outbox.send-timeout-ms=1000

# The poll interval above is what keeps the poller idle during tests. There is no
# spring.task.scheduling.enabled property, and @EnableScheduling on the
# application class is unconditional, so scheduling cannot be switched off here.

# --- Kafka ---
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.group-id=order-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

