# Test-scoped configuration for @DataJpaTest slices.
# Hibernate DDL handles schema creation; Flyway is tested at application startup.
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

# --- Outbox Poller (required for context loading) ---
orderflow.outbox.poll-interval-ms=999999999

# The poll interval above is what keeps the poller idle during tests. There is no
# spring.task.scheduling.enabled property, and @EnableScheduling on the
# application class is unconditional, so scheduling cannot be switched off here.
