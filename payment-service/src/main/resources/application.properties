spring.application.name=payment-service
server.port=${SERVER_PORT:8093}

# --- Datasource ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5436/payments}
spring.datasource.username=${DB_USERNAME:orderflow_user}
spring.datasource.password=${DB_PASSWORD:orderflow_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA ---
# Entities and Flyway migrations arrive in Phase 5; keep DDL generation off.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Kafka Consumer ---
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=payment-group
spring.kafka.consumer.auto-offset-reset=earliest

# --- Logging ---
logging.level.root=INFO
logging.level.com.pmfml.orderflow=DEBUG
