spring.application.name=payment-service
server.port=${SERVER_PORT:8093}

# --- Datasource ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5436/payments}
spring.datasource.username=${DB_USERNAME:orderflow_user}
spring.datasource.password=${DB_PASSWORD:orderflow_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- Kafka ---
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=payment-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# --- Stripe ---
stripe.api.key=${STRIPE_API_KEY:sk_test_mocked}

# --- Logging ---
logging.level.root=INFO
logging.level.com.pmfml.orderflow=DEBUG
